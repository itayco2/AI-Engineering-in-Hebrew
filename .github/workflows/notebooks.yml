# Tier 2: every chapter actually executes. Blocking, target under five minutes.
#
# nbmake, not nbval. nbval compares cell outputs against committed ones, and generated text
# is not reproducible even at temperature 0 with a fixed seed, so that would mean a
# permanently red build. nbmake asserts only that the notebook ran without raising, which is
# the one property that survives.
#
# Real embedding models run here, because embeddings ARE deterministic and they are the
# substance of chapters 01-03. Anything needing generation reads a committed cassette.
name: notebooks

on:
  push:
    branches: [main]
    # Executing every notebook takes minutes. A change to prose alone cannot break one.
    paths-ignore: ["**.md", "LICENSE", ".github/**", "!.github/workflows/notebooks.yml"]
  pull_request:

# Supersede in-flight runs for the same branch. Pushing three commits in a row used to start
# three full matrices and pay for all of them; now only the newest survives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      AIHE_BACKEND: replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: cache the embedding models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('chapters/*/meta.yml') }}
          restore-keys: hf-
      - name: CPU-only torch, before anything else
        # On Linux, plain `pip install torch` pulls the CUDA build and several gigabytes of
        # NVIDIA libraries that a CPU-only course never uses. Five chapters of model cache on
        # top of that overflowed the runner's 14 GB disk. Installing the CPU wheel first means
        # the requirements below find torch already satisfied and never fetch the big one.
        run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install --no-cache-dir -r requirements.txt -r requirements-test.txt -r requirements-notebooks.txt
      - run: pip install -e . --no-deps
      - name: the gate
        run: python scripts/gate.py
      - name: execute every chapter
        run: pytest --nbmake chapters/*/chapter.ipynb
