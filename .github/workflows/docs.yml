# The RTL site. Built on every push so a broken link fails the build rather than the reader,
# and deployed from main.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Supersede in-flight runs for the same branch. Pushing three commits in a row used to start
# three full matrices and pay for all of them; now only the newest survives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-docs-${{ hashFiles('chapters/*/meta.yml') }}
          restore-keys: hf-
      - name: CPU-only torch, before anything else
        # On Linux, plain `pip install torch` pulls the CUDA build and several gigabytes of
        # NVIDIA libraries that a CPU-only course never uses. Five chapters of model cache on
        # top of that overflowed the runner's 14 GB disk. Installing the CPU wheel first means
        # the requirements below find torch already satisfied and never fetch the big one.
        run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install --no-cache-dir -r requirements.txt -r requirements-test.txt -r requirements-docs.txt
      - run: pip install -e . --no-deps
      - name: build, and fail on a broken internal link
        # The chapters are executed at build time. Without this the notebooks reach for a
        # model that is not running, and mkdocs-jupyter embeds the traceback in the page
        # while the build still reports success.
        env:
          AIHE_BACKEND: replay
        run: mkdocs build --strict
      - name: no chapter may publish a traceback
        run: python scripts/check_site.py
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  # Deploy runs only once Pages is actually enabled. GitHub Pages needs the repository to be
  # public on a free plan, so until then this job is skipped rather than failed: a permanent
  # red cross in the checks list reads as a broken project, and nothing here is broken. The
  # site still builds and is verified on every push.
  #
  # To turn it on: make the repository public, enable Pages (Settings -> Pages -> GitHub
  # Actions), then add a repository variable PAGES_ENABLED with the value true.
  deploy:
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
