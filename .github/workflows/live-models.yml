# Tier 3: run the chapters against a real local model. Weekly, and it gates nothing.
#
# Deliberately no badge and continue-on-error. Its job is drift detection - noticing that a
# model release changed what a chapter demonstrates - not blocking a merge. A red badge that
# nobody can fix is how a repository starts looking abandoned.
name: live models

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.ollama
          key: live-${{ hashFiles('chapters/*/meta.yml') }}
          restore-keys: live-
      - name: CPU-only torch, before anything else
        # On Linux, plain `pip install torch` pulls the CUDA build and several gigabytes of
        # NVIDIA libraries that a CPU-only course never uses. Five chapters of model cache on
        # top of that overflowed the runner's 14 GB disk. Installing the CPU wheel first means
        # the requirements below find torch already satisfied and never fetch the big one.
        run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install --no-cache-dir -r requirements.txt -r requirements-test.txt -r requirements-notebooks.txt
      - run: pip install -e . --no-deps
      - name: start Ollama and pull a small model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3.2:3b
      - name: run every chapter against the real model
        env:
          AIHE_BACKEND: ollama
        run: pytest --nbmake chapters/*/chapter.ipynb
      - name: open an issue when a chapter stops working
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `live models: a chapter stopped running (${new Date().toISOString().slice(0,10)})`,
              body: `The weekly live-model run failed.\n\nThis gates nothing, but it usually means a model release changed what a chapter demonstrates.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['drift'],
            })
