[pytest]
testpaths = tests chapters
# Puts the repository root on sys.path so `from tests.conftest import ...` resolves in a
# clean environment. Without it the suite passes locally - where an editable install happens
# to put the root on the path - and fails in CI, which is the worst way to find out.
pythonpath = .
addopts = -q --strict-markers
markers =
    needs_model: requires a real model or a recorded cassette (excluded from the fast suite)
    slow: downloads or embeds (excluded from the fast suite)
